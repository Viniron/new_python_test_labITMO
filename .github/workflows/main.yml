name: Unit tests

on: push

jobs:
  test:
    name: Тесты на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # если тесты упадут на одной ОС, вторая всё равно доработает до конца
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: geometric_lib

    steps:
      - name: Получение кода репозитория
        uses: actions/checkout@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Версия Python
        run: python --version

      - name: Запуск unit-тестов
        run: python -m unittest -v
